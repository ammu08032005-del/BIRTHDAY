<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Memories ♡</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/memories.css">
</head>

<body>

  <div id="particles"></div>

  <a href="story.html" class="nav-back">
    ← back
  </a>


  <!-- =========================================
       PAGE INTRO
       ========================================= -->

  <header class="stage memories-intro">

    <p class="eyebrow fade-el">
      our memories
    </p>

    <h1 class="headline fade-el">
      some things I never wanted to forget ♡
    </h1>

    <p class="memories-subtitle fade-el">
      14 little moments, just us.
    </p>

  </header>


  <!-- =========================================
       SCRAPBOOK
       ========================================= -->

  <main class="scrapbook">


    <!-- 01 — Our first Onam -->

    <button
      class="polaroid fade-up"
      data-tilt="-4"
      data-caption="Our first Onam ♡"
      aria-label="Open memory 1">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory01.jpeg"
          alt="Our first Onam"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        01 — our first Onam ♡
      </span>

    </button>


    <!-- 02 — Canteen -->

    <button
      class="polaroid fade-up"
      data-tilt="3"
      data-caption="Just sitting in the canteen and doing absolutely nothing important."
      aria-label="Open memory 2">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory02.jpeg"
          alt="Us sitting in the college canteen"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        02 — canteen days
      </span>

    </button>


    <!-- 03 — First day of IV -->

    <button
      class="polaroid fade-up"
      data-tilt="-2"
      data-caption="First day of IV — and it started with a train journey."
      aria-label="Open memory 3">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory03.jpeg"
          alt="First day of IV in the train"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        03 — first day of IV 🚆
      </span>

    </button>


    <!-- 04 — Chikkamagaluru -->

    <button
      class="polaroid fade-up"
      data-tilt="5"
      data-caption="Second day of IV — Chikkamagaluru."
      aria-label="Open memory 4">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory04.jpeg"
          alt="Us during the second day of IV in Chikkamagaluru"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        04 — Chikkamagaluru
      </span>

    </button>


    <!-- 05 — Dandeli -->

    <button
      class="polaroid fade-up"
      data-tilt="-5"
      data-caption="Third day of IV — Dandeli."
      aria-label="Open memory 5">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory05.jpeg"
          alt="Us during the third day of IV in Dandeli"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        05 — Dandeli 🌿
      </span>

    </button>


    <!-- 06 — Goa -->

    <button
      class="polaroid fade-up"
      data-tilt="2"
      data-caption="Fourth day of IV — Goa."
      aria-label="Open memory 6">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory06.jpeg"
          alt="Us during the fourth day of IV in Goa"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        06 — Goa 🌊
      </span>

    </button>


    <!-- 07 — Scooty incident -->

    <button
      class="polaroid fade-up"
      data-tilt="-3"
      data-caption="You didn't take me on your scooty... so obviously I got angry. 😤"
      aria-label="Open memory 7">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory07.jpeg"
          alt="Us during the fifth day in Goa"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        07 — the scooty incident 😤
      </span>

    </button>


    <!-- 08 — Laughing in class -->

    <button
      class="polaroid fade-up"
      data-tilt="4"
      data-caption="Probably laughing at something that wasn't even that funny."
      aria-label="Open memory 8">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory08.jpeg"
          alt="Us laughing in class"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        08 — just laughing 😂
      </span>

    </button>


    <!-- 09 — He came to my place -->

    <button
      class="polaroid fade-up"
      data-tilt="-4"
      data-caption="You came to my place ♡"
      aria-label="Open memory 9">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory09.jpeg"
          alt="Dariuz came to my place"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        09 — you came to my place
      </span>

    </button>


    <!-- 10 — Temple -->

    <button
      class="polaroid fade-up"
      data-tilt="3"
      data-caption="You went to the temple just because I wished for it. 🥹"
      aria-label="Open memory 10">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory10.jpeg"
          alt="A memory connected to the temple visit"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        10 — you really did that 🥹
      </span>

    </button>


    <!-- 11 — His smile -->

    <button
      class="polaroid fade-up"
      data-tilt="-2"
      data-caption="That smile. That's it. That's the caption."
      aria-label="Open memory 11">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory11.jpeg"
          alt="Dariuz smiling"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        11 — that smile ♡
      </span>

    </button>


    <!-- 12 — I went to his place -->

    <button
      class="polaroid fade-up"
      data-tilt="5"
      data-caption="This time, I came to your place."
      aria-label="Open memory 12">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory12.jpeg"
          alt="Parvathy visiting Dariuz's place"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        12 — I came to your place
      </span>

    </button>


    <!-- 13 — Cafe -->

    <button
      class="polaroid fade-up"
      data-tilt="-5"
      data-caption="Just us at a cafe, doing our usual thing."
      aria-label="Open memory 13">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory13.jpeg"
          alt="Us together at a cafe"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        13 — cafe time ☕
      </span>

    </button>


    <!-- 14 — Current Onam -->

    <button
      class="polaroid fade-up"
      data-tilt="2"
      data-caption="Our Onam now. From the first one to this one... look at us. ♡"
      aria-label="Open memory 14">

      <span class="polaroid-photo">

        <img
          src="assets/images/memory14.jpeg"
          alt="Our current Onam together"
          loading="lazy">

      </span>

      <span class="polaroid-caption">
        14 — our Onam now 🌸
      </span>

    </button>


  </main>


  <!-- =========================================
       CONTINUE
       ========================================= -->

  <footer class="stage memories-footer">

    <p class="memories-ending">
      and somehow, I still want more memories with you ♡
    </p>

    <a
      href="reasons.html"
      class="link-forward">
      next →
    </a>

  </footer>


  <!-- =========================================
       LIGHTBOX
       ========================================= -->

  <div
    class="lightbox"
    id="lightbox"
    aria-hidden="true">

    <div class="lightbox-frame">

      <img
        id="lightboxImage"
        src=""
        alt="">

    </div>

    <p
      class="lightbox-caption"
      id="lightboxCaption">
    </p>

    <button
      class="lightbox-close"
      id="lightboxClose"
      aria-label="Close">
      ✕
    </button>

  </div>


  <script src="js/effects.js"></script>
  <script src="js/memories.js"></script>

</body>
</html>
